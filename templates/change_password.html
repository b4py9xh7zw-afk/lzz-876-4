{% extends "base.html" %}
{% block content %}
<div class="login-wrap">
  <div class="card">
    <h2>修改密码</h2>
    {% if error %}<div class="flash flash-error">{{ error }}</div>{% endif %}
    {% if message %}<div class="flash flash-success">{{ message }}</div>{% endif %}
    <form method="post">
      <label class="field"><span>原密码</span><input type="password" name="old_password" required></label>
      <label class="field"><span>新密码（至少 8 位）</span><input type="password" name="new_password" required></label>
      <label class="field"><span>确认新密码</span><input type="password" name="confirm" required></label>
      <button class="btn" type="submit">保存</button>
      <a class="btn btn-ghost" href="/dashboard">返回</a>
    </form>
  </div>
</div>
{% endblock %}
