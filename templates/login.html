{% extends "base.html" %}
{% block title %}登录 · 内控合规测评平台{% endblock %}
{% block content %}
<div class="login-wrap">
  <div class="card">
    <div class="login-logo">🛡️ 企业内控合规测评平台</div>
    <div class="login-sub">学习 · 测评 · 签署 · 全程留痕存证</div>
    {% if error %}<div class="flash flash-error">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
      <label class="field"><span>用户名 / 工号</span>
        <input type="text" name="username" autofocus required></label>
      <label class="field"><span>密码</span>
        <input type="password" name="password" required></label>
      <button class="btn" type="submit" style="width:100%">登 录</button>
    </form>
    <p class="small muted" style="margin-top:16px">
      演示账号：法务 <b>legal</b> / 审计 <b>audit</b> / 高风险岗 <b>zhang</b>、<b>wang</b> /
      普通员工 <b>chen</b>，密码均为 <span class="mono">compliance123</span>
    </p>
  </div>
</div>
{% endblock %}
